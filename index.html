<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff7f3" />
    <meta name="description" content="용기 내서 보내는 귀여운 데이트 신청" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta property="og:title" content="잠깐, 물어볼 게 있어 💌" />
    <meta property="og:description" content="링크를 열었다면 대답해줘야 해!" />
    <title>잠깐, 물어볼 게 있어 💌</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="paper-noise" aria-hidden="true"></div>
    <div class="doodle doodle--one" aria-hidden="true">♡</div>
    <div class="doodle doodle--two" aria-hidden="true">✿</div>
    <div class="doodle doodle--three" aria-hidden="true">ꕤ</div>

    <main class="page-shell">
      <section class="card" id="questionCard" aria-labelledby="questionTitle">
        <div class="tape" aria-hidden="true"></div>
        <p class="eyebrow" id="recipient">TO. 너에게</p>

        <div class="stamp" aria-hidden="true">
          <span>두근</span>
          <strong>100%</strong>
        </div>

        <div class="illustration" aria-hidden="true">
          <div class="envelope">
            <span class="envelope__heart">♥</span>
          </div>
          <span class="spark spark--one">✦</span>
          <span class="spark spark--two">✦</span>
          <span class="spark spark--three">·</span>
        </div>

        <p class="lead">사실은 말이야…</p>
        <h1 id="questionTitle">
          나랑 같이<br />
          <span id="datePlan">맛있는 거 먹으러 갈래?</span>
        </h1>
        <p class="subcopy">신중하게 골라도 돼. 정답은 하나지만.</p>

        <div class="button-zone" id="buttonZone">
          <button class="button button--yes" id="yesButton" type="button">
            좋아! <span aria-hidden="true">♥</span>
          </button>
          <button class="button button--no" id="noButton" type="button">아니오</button>
        </div>

        <p class="hint" id="hint" aria-live="polite">힌트: 마음이 가는 쪽을 눌러봐</p>
        <p class="signature" id="signature">FROM. 용기 낸 누군가</p>
      </section>

      <section class="card card--answer" id="answerCard" aria-labelledby="answerTitle" hidden>
        <div class="tape" aria-hidden="true"></div>
        <div class="answer-heart" aria-hidden="true">♥</div>
        <p class="eyebrow">약속 완료!</p>
        <h2 id="answerTitle">진짜지? 취소 없음!</h2>
        <p class="answer-copy" id="answerCopy">
          그럼 우리, 설레는 마음만 챙겨서 만나자.<br />나머지는 내가 준비할게 :)
        </p>
        <div class="ticket" aria-label="데이트 약속 티켓">
          <span>DATE TICKET</span>
          <strong>우리 둘 · 곧 만나요</strong>
          <small>유효기간: 만나서 웃을 때까지</small>
        </div>
        <button class="button button--again" id="againButton" type="button">한 번 더 보기</button>
      </section>
    </main>

    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <script src="script.js"></script>
  </body>
</html>
